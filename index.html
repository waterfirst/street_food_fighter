<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg-a:#0b0c12;--bg-b:#1a1c28;--card:#171923;--card2:#1f2230;--text:#f7f1e5;--muted:#9aa0af;--brand:#c9a24b;--brand2:#f0d98a;--ink:#241a05;--line:#2b2e3d;--green:#39a96b;--red:#c94a4a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#2c3043 0,#11131d 46%,#08090e 100%);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif}.brand{font-family:'Playfair Display',serif;letter-spacing:.3px}.splash{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#25293c,#08090e);z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--brand2);animation:hideSplash .7s ease 1.25s forwards}.splash .truck{font-size:82px;filter:drop-shadow(0 8px 18px rgba(201,162,75,.35));animation:bounce .8s infinite alternate}.splash h1{font-size:32px;margin:12px 0 4px}.splash p{margin:0;color:var(--muted);font-weight:800}@keyframes bounce{to{transform:translateY(-12px)}}@keyframes hideSplash{to{opacity:0;visibility:hidden}}
.wrap{max-width:920px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}.hero{padding:18px;border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:26px;background:linear-gradient(180deg,rgba(31,34,48,.98),rgba(18,20,29,.98));box-shadow:0 22px 55px rgba(0,0,0,.48);margin-top:10px}.top{display:flex;align-items:center;gap:12px}.logo{font-size:44px;filter:drop-shadow(0 5px 12px rgba(201,162,75,.35))}.top h1{font-size:clamp(26px,6vw,38px);line-height:1.05;margin:0;color:var(--brand2)}.hook{margin:8px 0 0;color:#e8dcc2;font-size:17px;font-weight:900;line-height:1.35}.subhook{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.45}.panel{display:none}.panel.active{display:block}.card{background:rgba(23,25,35,.96);border:1px solid var(--line);border-radius:22px;padding:15px;margin:14px 0;box-shadow:0 10px 24px rgba(0,0,0,.32)}.card h2{margin:0 0 11px;color:var(--brand2);font-size:18px}.mapShell{position:relative;margin-top:14px;border-radius:24px;padding:7px;background:linear-gradient(135deg,rgba(201,162,75,.8),rgba(43,46,61,.7));box-shadow:0 18px 42px rgba(0,0,0,.45)}#map{height:58vh;min-height:360px;border-radius:20px;overflow:hidden;background:#d6d3c2}.mapCaption{position:absolute;left:18px;right:18px;bottom:18px;padding:11px 13px;border-radius:16px;background:rgba(10,12,18,.78);backdrop-filter:blur(8px);font-size:13px;font-weight:800;color:#f7f1e5;display:flex;justify-content:space-between;gap:8px}.range{display:flex;gap:11px;align-items:center}.range label{font-size:14px;font-weight:900;color:#f4e8cc}.range input{flex:1}.range b{color:var(--brand2)}button{font-family:inherit}.main{width:100%;min-height:52px;border:0;border-radius:17px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--ink);font-size:17px;font-weight:1000;box-shadow:0 11px 25px rgba(201,162,75,.24);margin-top:10px}.green{background:linear-gradient(135deg,#2f8f5b,var(--green));color:#eafff0}.dark{background:#252838;color:var(--text);border:1px solid var(--line);box-shadow:none}.red{background:linear-gradient(135deg,#8f2f36,var(--red));color:#ffecec}.status{padding:11px 12px;border-left:3px solid var(--brand);background:#181b26;border-radius:15px;color:#e9dfcd;font-size:13px;line-height:1.45;margin-top:10px}.bottomNav{display:flex;justify-content:center;align-items:center;gap:8px;margin:18px auto 0}.mini{border:1px solid var(--line);background:rgba(31,34,48,.9);color:var(--muted);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:900}.mini.primary{color:var(--brand2);border-color:rgba(201,162,75,.55)}.list{display:grid;gap:10px}.truck-card{border:1px solid var(--line);border-radius:19px;padding:14px;background:linear-gradient(180deg,#1a1d29,#141620);box-shadow:0 6px 18px rgba(0,0,0,.28)}.truck-card b{font-size:18px;color:var(--brand2)}.small{font-size:13px;color:var(--muted);line-height:1.45}.badge{display:inline-block;background:rgba(201,162,75,.14);color:var(--brand2);border:1px solid rgba(201,162,75,.65);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:900}.emoji-marker{font-size:32px;text-shadow:0 3px 10px rgba(0,0,0,.55)}label{display:block;margin:10px 0 6px;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.05em}input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:15px;background:#12141c;color:var(--text);font-size:16px}textarea{resize:vertical}.row{display:grid;grid-template-columns:1fr;gap:10px}.photoBtns{display:grid;grid-template-columns:1fr;gap:10px}.preview{width:100%;max-height:260px;object-fit:contain;background:#000;border:1px solid var(--line);border-radius:17px;margin-top:10px}.notice{padding:12px;border-radius:17px;background:#1c1f2d;border-left:3px solid var(--brand);color:#ead893;font-size:13px;font-weight:800;line-height:1.5}.lock{position:fixed;inset:0;background:#05060a;z-index:100;display:none;align-items:center;justify-content:center}.lock.active{display:flex}.lockbox{width:min(360px,92vw);text-align:center}.dots{height:38px;font-size:30px;letter-spacing:10px;color:var(--brand2);margin:12px 0 22px}.err{height:24px;color:#f2879a;font-weight:900}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.key{height:62px;border-radius:50px;border:1px solid #3a3220;background:#12131a;color:var(--brand2);font-size:26px;font-weight:900}.verify-btn,.like-btn,.edit-btn,.reset-btn,.delete-btn{min-height:42px;border-radius:13px;padding:0 13px;font-weight:900}.verify-btn{border:1px solid var(--brand);background:transparent;color:var(--brand2)}.like-btn{border:0;background:#292c3a;color:#747b8c}.like-btn:not(:disabled){background:linear-gradient(135deg,#d9536a,#f2879a);color:white}.edit-btn,.reset-btn{background:transparent;border:1px solid var(--brand);color:var(--brand2)}.delete-btn{border:0;background:var(--red);color:white}.like-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.verify-msg{font-size:13px;color:var(--muted);margin-top:8px}@media(min-width:680px){.row,.photoBtns{grid-template-columns:1fr 1fr}.hero{padding:24px}}
</style>
</head>
<body>
<div class="splash"><div><div class="truck">🚚🍜</div><h1 class="brand">Street Food Fighter</h1><p>지금 문 연 푸드트럭</p></div></div>
<div id="lock" class="lock"><div class="lockbox"><div class="dots" id="dots"></div><div class="err" id="lockErr"></div><div class="pad"><button class="key">1</button><button class="key">2</button><button class="key">3</button><button class="key">4</button><button class="key">5</button><button class="key">6</button><button class="key">7</button><button class="key">8</button><button class="key">9</button><button class="key" id="cancelKey">×</button><button class="key">0</button><button class="key" id="backKey">⌫</button></div></div></div>
<div class="wrap"><section class="hero"><div class="top"><div class="logo">🚚</div><div><h1 class="brand">Street Food Fighter</h1><p class="hook">배고픈 지금, 근처 푸드트럭 바로 찾기</p><p class="subhook">지도에서 영업중인 트럭만 빠르게 보여드려요.</p></div></div>
<div id="customerPanel" class="panel active"><div class="card"><div class="range"><label>반경</label><input id="radius" type="range" min="0.5" max="10" step="0.5" value="3"><b id="radiusLabel">3km</b></div><button class="main green" id="nearBtn">📍 내 주변 푸드트럭 찾기</button><div id="customerStatus" class="status">위치를 허용하면 주변 영업중 푸드트럭을 보여드립니다.</div></div><div class="mapShell"><div id="map"></div><div class="mapCaption"><span>LIVE FOOD MAP</span><span id="mapCount">영업중 0</span></div></div><div class="card"><h2>지금 영업중 <span class="badge" id="openCount">0</span></h2><div id="openList" class="list"></div></div></div>
<div id="driverPanel" class="panel"><div class="card"><div class="notice">사진 찍기 또는 갤러리 원본 선택으로 영업개시하세요.</div><div class="row"><div><label>푸드트럭 이름</label><input id="truckName" placeholder="예: 망향리 타코야끼"></div><div><label>음식 종목</label><select id="foodType"><option value="🍜|국수/라멘">🍜 국수/라멘</option><option value="🍔|버거">🍔 버거</option><option value="🌮|타코">🌮 타코</option><option value="🍕|피자">🍕 피자</option><option value="🍗|치킨">🍗 치킨</option><option value="🥟|만두">🥟 만두</option><option value="🍢|어묵/분식">🍢 어묵/분식</option><option value="☕|커피/음료">☕ 커피/음료</option><option value="🍦|디저트">🍦 디저트</option></select></div></div><label>메뉴/공지</label><textarea id="memo" rows="3" placeholder="예: 오늘은 불고기 타코, 현금/계좌 가능"></textarea><div class="photoBtns"><button class="main" id="cameraBtn">📸 사진 찍기</button><button class="main green" id="galleryBtn">🖼 갤러리 올리기</button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none"><input id="galleryInput" type="file" accept="image/*,.jpg,.jpeg,.heic,.heif" style="display:none"><button class="main dark" id="locBtn">📍 현재 위치로 영업개시</button><img id="preview" class="preview" style="display:none"><div id="driverStatus" class="status">아직 영업개시 전입니다.</div></div><div class="card"><h2>내 등록 푸드트럭</h2><div id="myList" class="list"></div></div></div>
<div id="adminPanel" class="panel"><div class="card"><div class="notice">관리자만 매장 정보 수정·삭제와 좋아요 초기화를 할 수 있습니다.</div><button class="main red" id="resetAllBtn">전체 좋아요 초기화</button></div><div class="card"><h2>매장 관리</h2><div id="adminList" class="list"></div></div></div>
<div class="bottomNav"><button id="customerTab" class="mini primary">손님</button><button id="driverTab" class="mini">사장님</button><button id="adminTab" class="mini">관리자</button></div>
</section></div><input id="verifyInput" type="file" accept="image/*" capture="environment" style="display:none">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script><script>
const KEY='sff_trucks_v1',LIKE_KEY='sff_liked_v1',DRIVER_ID_KEY='sff_driver_id',VERIFY_RADIUS_KM=.15,$=id=>document.getElementById(id);let map=null,userMarker=null,circle=null,markers=[],pin='',lockMode='driver',lastCustomerList=[],verifiedIds=new Set(),verifyMsgs={},currentVerifyId=null,editingId=null;function getDriverId(){let id=localStorage.getItem(DRIVER_ID_KEY);if(!id){id=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();localStorage.setItem(DRIVER_ID_KEY,id)}return id}const DRIVER_ID=getDriverId(),FOOD_OPTIONS=[['🍜','국수/라멘'],['🍔','버거'],['🌮','타코'],['🍕','피자'],['🍗','치킨'],['🥟','만두'],['🍢','어묵/분식'],['☕','커피/음료'],['🍦','디저트']];function nextReset(){const n=new Date(),r=new Date(n);r.setHours(7,0,0,0);if(n>=r)r.setDate(r.getDate()+1);return r.getTime()}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]').map(t=>({...t,likes:Number.isFinite(t.likes)?t.likes:0}))}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function prune(){const a=load().filter(t=>t.openUntil>Date.now());save(a);return a}function liked(){try{return JSON.parse(localStorage.getItem(LIKE_KEY)||'[]')}catch{return[]}}function saveLiked(a){localStorage.setItem(LIKE_KEY,JSON.stringify(a))}function isLiked(id){return liked().includes(id)}function distKm(a,b,c,d){const R=6371,to=x=>x*Math.PI/180,h=Math.sin(to(c-a)/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(to(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function fmt(ts){return new Date(ts).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('customerTab').onclick=()=>switchTab('customer');$('driverTab').onclick=()=>openLock('driver');$('adminTab').onclick=()=>openLock('admin');function switchTab(t){['customer','driver','admin'].forEach(x=>{$(x+'Panel').classList.toggle('active',x===t)});$('customerTab').classList.toggle('primary',t==='customer');$('driverTab').classList.toggle('primary',t==='driver');$('adminTab').classList.toggle('primary',t==='admin');if(t==='customer')setTimeout(initMap,50);if(t==='admin')renderAdmin()}function openLock(mode){lockMode=mode;pin='';$('dots').textContent='';$('lockErr').textContent='';$('lock').classList.add('active')}function closeLock(){$('lock').classList.remove('active');switchTab('customer')}document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{if(b.id==='cancelKey'){closeLock();return}if(b.id==='backKey')pin=pin.slice(0,-1);else if(pin.length<4)pin+=b.textContent;$('dots').textContent='•'.repeat(pin.length);if(pin.length===4){const target=lockMode==='admin'?'0000':'1111';if(pin===target){$('lock').classList.remove('active');switchTab(lockMode)}else{$('lockErr').textContent='비밀번호 오류';setTimeout(()=>{pin='';$('dots').textContent=''},350)}}});
$('radius').oninput=()=>{$('radiusLabel').textContent=$('radius').value+'km'};$('cameraBtn').onclick=()=>$('cameraInput').click();$('galleryBtn').onclick=()=>$('galleryInput').click();$('cameraInput').onchange=e=>{if(e.target.files.length)startFromPhoto(e.target.files[0],'사진 찍기')};$('galleryInput').onchange=e=>{if(e.target.files.length)startFromPhoto(e.target.files[0],'갤러리')};$('locBtn').onclick=()=>navigator.geolocation.getCurrentPosition(p=>registerTruck(p.coords.latitude,p.coords.longitude,'현재 위치'),e=>alert(e.message),{enableHighAccuracy:true,timeout:12000});$('nearBtn').onclick=()=>navigator.geolocation.getCurrentPosition(p=>renderCustomer(p.coords.latitude,p.coords.longitude),e=>alert(e.message),{enableHighAccuracy:true,timeout:12000});async function startFromPhoto(file,source){$('driverStatus').textContent=source+' GPS 확인 중...';$('preview').src=URL.createObjectURL(file);$('preview').style.display='block';let gps=null;try{gps=await exifr.gps(file)}catch(e){}if(gps&&Number.isFinite(gps.latitude)&&Number.isFinite(gps.longitude))registerTruck(gps.latitude,gps.longitude,source+' GPS');else $('driverStatus').innerHTML='사진에 GPS가 없습니다. <b>현재 위치로 영업개시</b>를 사용하세요.'}function registerTruck(lat,lon,source){const [emoji,food]=$('foodType').value.split('|'),truck={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),driverId:DRIVER_ID,name:$('truckName').value||'이름없는 푸드트럭',emoji,food,memo:$('memo').value||'',lat,lon,source,openedAt:Date.now(),openUntil:nextReset(),likes:0};const a=prune();a.push(truck);save(a);$('driverStatus').innerHTML=`✅ 영업개시 완료<br>${emoji} ${esc(truck.name)}<br>오전 7시 자동 리셋`;renderMy()}function renderMy(){const a=prune().filter(t=>t.driverId===DRIVER_ID);$('myList').innerHTML=a.length?a.map(t=>`<div class="truck-card"><b>${t.emoji} ${esc(t.name)} <span class="badge">🤍 ${t.likes||0}</span></b><div class="small">${esc(t.food)} · ${fmt(t.openedAt)}<br>${esc(t.memo)}</div></div>`).join(''):'<p class="small">등록된 푸드트럭이 없습니다.</p>'}renderMy();
function initMap(){if(map)return;map=L.map('map',{zoomControl:false}).setView([36.5,127.8],7);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}function renderCustomer(lat,lon){initMap();const radius=Number($('radius').value),a=prune().map(t=>({...t,distance:distKm(lat,lon,t.lat,t.lon)})).filter(t=>t.distance<=radius).sort((x,y)=>x.distance-y.distance);map.setView([lat,lon],14);if(userMarker)map.removeLayer(userMarker);if(circle)map.removeLayer(circle);markers.forEach(m=>map.removeLayer(m));markers=[];userMarker=L.circleMarker([lat,lon],{radius:8,color:'#f0d98a',fillColor:'#c9a24b',fillOpacity:1}).addTo(map).bindPopup('내 위치');circle=L.circle([lat,lon],{radius:radius*1000,color:'#c9a24b',fillColor:'#c9a24b',fillOpacity:.08,weight:1}).addTo(map);a.forEach(t=>{const icon=L.divIcon({className:'emoji-marker',html:t.emoji,iconSize:[36,36]});markers.push(L.marker([t.lat,t.lon],{icon}).addTo(map).bindPopup(`<b>${t.emoji} ${esc(t.name)}</b><br>${esc(t.food)} · 영업중<br>${esc(t.memo)}<br>${t.distance.toFixed(1)}km`))});$('customerStatus').textContent=`반경 ${radius}km · 영업중 ${a.length}곳`;$('mapCount').textContent=`영업중 ${a.length}`;lastCustomerList=a;renderOpenList()}function cardHTML(t){const hasLiked=isLiked(t.id),verified=verifiedIds.has(t.id),can=hasLiked||verified;return `<div class="truck-card"><b>${t.emoji} ${esc(t.name)}</b><div class="small">${esc(t.food)} · ${t.distance.toFixed(1)}km<br>${esc(t.memo)}<br>${fmt(t.openedAt)} 오픈</div><div class="like-row">${hasLiked?'':`<button class="verify-btn" data-id="${t.id}">📸 방문 인증</button>`}<button class="like-btn" data-id="${t.id}"${can?'':' disabled'}>${hasLiked?'❤️ 완료':'🤍 좋아요'} <span>${t.likes||0}</span></button></div>${verifyMsgs[t.id]?`<div class="verify-msg">${esc(verifyMsgs[t.id])}</div>`:''}</div>`}function renderOpenList(){$('openCount').textContent=lastCustomerList.length;$('openList').innerHTML=lastCustomerList.length?lastCustomerList.map(cardHTML).join(''):'<p class="small">근처에 영업중인 푸드트럭이 없습니다.</p>'}$('openList').addEventListener('click',e=>{const v=e.target.closest('.verify-btn'),l=e.target.closest('.like-btn');if(v){currentVerifyId=v.dataset.id;$('verifyInput').click()}if(l&&!l.disabled)doLike(l.dataset.id)});$('verifyInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file||!currentVerifyId)return;const t=lastCustomerList.find(x=>x.id===currentVerifyId);if(!t)return;verifyMsgs[t.id]='GPS 확인 중...';renderOpenList();let gps=null;try{gps=await exifr.gps(file)}catch(err){}if(gps&&Number.isFinite(gps.latitude)&&Number.isFinite(gps.longitude)){const d=distKm(gps.latitude,gps.longitude,t.lat,t.lon);if(d<=VERIFY_RADIUS_KM){verifiedIds.add(t.id);verifyMsgs[t.id]=`방문 인증 완료 · 좋아요 가능`}else verifyMsgs[t.id]=`인증 실패 · 약 ${d.toFixed(2)}km 떨어져 있어요`}else verifyMsgs[t.id]='사진에서 GPS를 찾을 수 없어요';renderOpenList()};function doLike(id){if(isLiked(id)||!verifiedIds.has(id))return;const all=prune(),t=all.find(x=>x.id===id);if(!t)return;t.likes=(t.likes||0)+1;save(all);const l=liked();l.push(id);saveLiked(l);const c=lastCustomerList.find(x=>x.id===id);if(c)c.likes=t.likes;verifyMsgs[id]='좋아요 완료';renderOpenList()}
function adminViewHTML(t){return `<div class="truck-card"><b>${t.emoji} ${esc(t.name)}</b><div class="small">${esc(t.food)} · ${fmt(t.openedAt)}<br>${esc(t.memo)}</div><div class="like-row"><span class="badge">🤍 ${t.likes||0}</span><button class="edit-btn" data-edit="${t.id}">수정</button><button class="reset-btn" data-reset="${t.id}">초기화</button><button class="delete-btn" data-delete="${t.id}">삭제</button></div></div>`}function adminEditHTML(t){const opts=FOOD_OPTIONS.map(([e,l])=>`<option value="${e}|${l}"${e===t.emoji&&l===t.food?' selected':''}>${e} ${l}</option>`).join('');return `<div class="truck-card"><label>이름</label><input id="editName-${t.id}" value="${esc(t.name)}"><label>종목</label><select id="editFood-${t.id}">${opts}</select><label>공지</label><textarea id="editMemo-${t.id}" rows="3">${esc(t.memo)}</textarea><div class="like-row"><button class="main green" data-save="${t.id}">저장</button><button class="main dark" data-cancel="${t.id}">취소</button></div></div>`}function renderAdmin(){const a=prune();$('adminList').innerHTML=a.length?a.map(t=>t.id===editingId?adminEditHTML(t):adminViewHTML(t)).join(''):'<p class="small">등록된 푸드트럭이 없습니다.</p>'}$('adminList').addEventListener('click',e=>{const ed=e.target.closest('[data-edit]'),ca=e.target.closest('[data-cancel]'),sv=e.target.closest('[data-save]'),rs=e.target.closest('[data-reset]'),dl=e.target.closest('[data-delete]');if(ed){editingId=ed.dataset.edit;renderAdmin()}if(ca){editingId=null;renderAdmin()}if(sv){const id=sv.dataset.save,all=prune(),t=all.find(x=>x.id===id);if(!t)return;const [emoji,food]=$(`editFood-${id}`).value.split('|');t.name=$(`editName-${id}`).value||'이름없는 푸드트럭';t.emoji=emoji;t.food=food;t.memo=$(`editMemo-${id}`).value||'';save(all);editingId=null;renderAdmin();renderOpenList();renderMy()}if(rs){const id=rs.dataset.reset,all=prune(),t=all.find(x=>x.id===id);if(!t)return;t.likes=0;save(all);saveLiked(liked().filter(x=>x!==id));verifiedIds.delete(id);delete verifyMsgs[id];renderAdmin();renderOpenList()}if(dl){const id=dl.dataset.delete,all=prune(),t=all.find(x=>x.id===id);if(!t||!confirm('삭제할까요?'))return;save(all.filter(x=>x.id!==id));lastCustomerList=lastCustomerList.filter(x=>x.id!==id);renderAdmin();renderOpenList();renderMy()}});$('resetAllBtn').onclick=()=>{save(prune().map(t=>({...t,likes:0})));saveLiked([]);verifiedIds.clear();verifyMsgs={};lastCustomerList.forEach(t=>t.likes=0);renderAdmin();renderOpenList();alert('초기화했습니다')};setTimeout(initMap,1400);
</script></body></html>
