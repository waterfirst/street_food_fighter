<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Food Fighter</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fff7ed;--card:#fff;--text:#111827;--muted:#6b7280;--brand:#f97316;--dark:#1f2937;--green:#16a34a;--red:#dc2626;--line:#fed7aa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff7ed,#fef3c7);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.splash{position:fixed;inset:0;background:linear-gradient(135deg,#f97316,#ef4444);z-index:50;display:flex;align-items:center;justify-content:center;color:white;text-align:center;animation:hideSplash .7s ease 1.6s forwards}.truck{font-size:80px;animation:bounce .8s infinite alternate}.splash h1{font-size:30px;margin:10px 0 4px}.splash p{margin:0;font-weight:800}@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-12px)}}@keyframes hideSplash{to{opacity:0;visibility:hidden}}.wrap{max-width:920px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}.hero{background:#fff;border-radius:24px;padding:18px;box-shadow:0 10px 28px rgba(0,0,0,.1);margin-top:10px}.title{display:flex;gap:12px;align-items:center}.logo{font-size:42px}.title h1{font-size:clamp(24px,6vw,36px);line-height:1.1;margin:0}.hint{color:var(--muted);line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.tab{border:0;border-radius:16px;padding:14px;background:#ffedd5;color:#9a3412;font-weight:900;font-size:17px}.tab.active{background:var(--brand);color:white}.panel{display:none}.panel.active{display:block}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:1fr;gap:10px}label{font-weight:900;margin-top:8px;display:block}input,select,textarea{width:100%;border:1px solid #e5e7eb;border-radius:14px;padding:13px;font-size:16px;background:#fff}button.main,a.main{width:100%;min-height:50px;border:0;border-radius:16px;background:var(--brand);color:#fff;font-size:17px;font-weight:900;text-decoration:none;display:flex;align-items:center;justify-content:center;margin-top:10px}button.dark{background:var(--dark)}button.green{background:var(--green)}button.red{background:var(--red)}#map,#driverMap{width:100%;height:58vh;min-height:360px;border-radius:20px;border:1px solid #e5e7eb;overflow:hidden;background:#e5e7eb}.preview{width:100%;max-height:260px;object-fit:contain;background:#111;border-radius:16px;margin-top:10px}.status{padding:12px;border-radius:16px;background:#f8fafc;border:1px solid #e5e7eb;line-height:1.55;margin-top:10px}.list{display:grid;gap:10px}.truck-card{border:1px solid #e5e7eb;border-radius:18px;padding:13px;background:#fff}.truck-card b{font-size:18px}.small{font-size:13px;color:var(--muted)}.emoji-marker{font-size:30px;text-shadow:0 2px 6px rgba(0,0,0,.28)}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:16px;padding:12px;font-weight:800;line-height:1.55}.range-line{display:flex;gap:10px;align-items:center}.range-line input{flex:1}.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:4px 9px;font-weight:900;font-size:12px}@media(min-width:680px){.row{grid-template-columns:1fr 1fr}.hero{padding:24px}}
</style>
</head>
<body>
<div class="splash"><div><div class="truck">🚚🍜</div><h1>Street Food Fighter</h1><p>내 주변 영업중 푸드트럭</p></div></div>
<div class="wrap"><section class="hero"><div class="title"><div class="logo">🚚</div><div><h1>Street Food Fighter</h1><p class="hint">기사님은 사진 GPS로 영업개시, 고객은 반경 안 영업중 푸드트럭을 지도에서 확인합니다.</p></div></div><div class="tabs"><button id="driverTab" class="tab active">기사 버튼</button><button id="customerTab" class="tab">고객뷰</button></div>
<div id="driverPanel" class="panel active"><div class="card"><div class="notice">사진 선택은 갤러리 캡처/공유본이 아니라 원본 JPG/HEIC를 선택하세요. GPS가 없으면 현재 위치 버튼을 사용합니다.</div><div class="row"><div><label>푸드트럭 이름</label><input id="truckName" placeholder="예: 망향리 타코야끼"></div><div><label>음식 종목</label><select id="foodType"><option value="🍜|국수/라멘">🍜 국수/라멘</option><option value="🍔|버거">🍔 버거</option><option value="🌮|타코">🌮 타코</option><option value="🍕|피자">🍕 피자</option><option value="🍗|치킨">🍗 치킨</option><option value="🥟|만두">🥟 만두</option><option value="🍢|어묵/분식">🍢 어묵/분식</option><option value="☕|커피/음료">☕ 커피/음료</option><option value="🍦|디저트">🍦 디저트</option></select></div></div><label>메뉴/공지</label><textarea id="memo" rows="3" placeholder="예: 오늘은 불고기 타코, 현금/계좌 가능"></textarea><button class="main" id="photoBtn">📷 원본 사진으로 영업개시</button><input id="photoInput" type="file" accept="image/*,.jpg,.jpeg,.heic,.heif" style="display:none"><button class="main dark" id="locBtn">📍 GPS 없을 때 현재 위치로 영업개시</button><img id="preview" class="preview" style="display:none"><div id="driverStatus" class="status">아직 영업개시 전입니다.</div></div><div class="card"><h2>내 등록 푸드트럭</h2><div id="myList" class="list"></div><button class="main red" id="clearBtn">오늘 등록 전체 삭제</button></div></div>
<div id="customerPanel" class="panel"><div class="card"><div class="range-line"><label style="margin:0">반경</label><input id="radius" type="range" min="0.5" max="10" step="0.5" value="3"><b id="radiusLabel">3km</b></div><button class="main green" id="nearBtn">📍 내 주변 영업중 푸드트럭 보기</button><div id="customerStatus" class="status">반경을 정하고 버튼을 누르세요.</div></div><div id="map"></div><div class="card"><h2>영업중 목록 <span class="badge" id="openCount">0</span></h2><div id="openList" class="list"></div></div></div></section></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
<script>
const KEY='sff_trucks_v1';let map=null,userMarker=null,circle=null,markers=[];const $=id=>document.getElementById(id);
function nextReset(){const n=new Date(),r=new Date(n);r.setHours(7,0,0,0);if(n>=r)r.setDate(r.getDate()+1);return r.getTime()}function prune(){const now=Date.now();const a=load().filter(t=>t.openUntil>now);localStorage.setItem(KEY,JSON.stringify(a));return a}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function distKm(a,b,c,d){const R=6371,to=x=>x*Math.PI/180;const x=to(c-a),y=to(d-b);const h=Math.sin(x/2)**2+Math.cos(to(a))*Math.cos(to(c))*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}function fmt(ts){return new Date(ts).toLocaleString('ko-KR',{hour:'2-digit',minute:'2-digit',month:'numeric',day:'numeric'})}
$('driverTab').onclick=()=>switchTab('driver');$('customerTab').onclick=()=>switchTab('customer');function switchTab(t){$('driverTab').classList.toggle('active',t==='driver');$('customerTab').classList.toggle('active',t==='customer');$('driverPanel').classList.toggle('active',t==='driver');$('customerPanel').classList.toggle('active',t==='customer');if(t==='customer')setTimeout(initMap,50)}
$('radius').oninput=()=>{$('radiusLabel').textContent=$('radius').value+'km'};$('photoBtn').onclick=()=>$('photoInput').click();$('photoInput').onchange=e=>{if(e.target.files.length)startFromPhoto(e.target.files[0])};$('locBtn').onclick=()=>navigator.geolocation.getCurrentPosition(p=>registerTruck(p.coords.latitude,p.coords.longitude,'현재 위치'),e=>alert(e.message),{enableHighAccuracy:true,timeout:12000});$('clearBtn').onclick=()=>{save([]);renderMy();alert('삭제했습니다')};$('nearBtn').onclick=()=>navigator.geolocation.getCurrentPosition(p=>renderCustomer(p.coords.latitude,p.coords.longitude),e=>alert(e.message),{enableHighAccuracy:true,timeout:12000});
async function startFromPhoto(file){$('driverStatus').textContent='사진 EXIF GPS 읽는 중...';$('preview').src=URL.createObjectURL(file);$('preview').style.display='block';let gps=null;try{gps=await exifr.gps(file)}catch(e){}if(gps&&Number.isFinite(gps.latitude)&&Number.isFinite(gps.longitude))registerTruck(gps.latitude,gps.longitude,'사진 GPS');else $('driverStatus').innerHTML='사진에 GPS가 없습니다. <b>현재 위치로 영업개시</b> 버튼을 사용하세요.'}
function registerTruck(lat,lon,source){const [emoji,food]=$('foodType').value.split('|');const truck={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name:$('truckName').value||'이름없는 푸드트럭',emoji,food,memo:$('memo').value||'',lat,lon,source,openedAt:Date.now(),openUntil:nextReset()};const a=prune();a.push(truck);save(a);$('driverStatus').innerHTML=`✅ 영업개시 등록 완료<br>${emoji} ${truck.name}<br>좌표 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>다음날 아침 7시 자동 리셋`;renderMy()}
function renderMy(){const a=prune();$('myList').innerHTML=a.length?a.map(t=>`<div class="truck-card"><b>${t.emoji} ${esc(t.name)}</b><div>${esc(t.food)} · 영업개시 ${fmt(t.openedAt)}</div><div class="small">${esc(t.memo)}<br>${t.lat.toFixed(5)}, ${t.lon.toFixed(5)} · ${esc(t.source)}</div></div>`).join(''):'<p class="hint">등록된 푸드트럭이 없습니다.</p>'}renderMy();
function initMap(){if(map)return;map=L.map('map').setView([36.5,127.8],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map)}
function renderCustomer(lat,lon){initMap();const radius=Number($('radius').value);const a=prune().map(t=>({...t,distance:distKm(lat,lon,t.lat,t.lon)})).filter(t=>t.distance<=radius).sort((x,y)=>x.distance-y.distance);map.setView([lat,lon],14);if(userMarker)map.removeLayer(userMarker);if(circle)map.removeLayer(circle);markers.forEach(m=>map.removeLayer(m));markers=[];userMarker=L.marker([lat,lon]).addTo(map).bindPopup('내 위치');circle=L.circle([lat,lon],{radius:radius*1000}).addTo(map);a.forEach(t=>{const icon=L.divIcon({className:'emoji-marker',html:t.emoji,iconSize:[36,36]});const m=L.marker([t.lat,t.lon],{icon}).addTo(map).bindPopup(`<b>${t.emoji} ${esc(t.name)}</b><br>${esc(t.food)} 영업중<br>${esc(t.memo)}<br>${t.distance.toFixed(1)}km`);markers.push(m)});$('openCount').textContent=a.length;$('customerStatus').textContent=`반경 ${radius}km 안 영업중 푸드트럭 ${a.length}개`;$('openList').innerHTML=a.length?a.map(t=>`<div class="truck-card"><b>${t.emoji} ${esc(t.name)}</b><div>${esc(t.food)} · ${t.distance.toFixed(1)}km</div><div class="small">${esc(t.memo)}<br>영업개시 ${fmt(t.openedAt)} · 오전 7시 리셋</div></div>`).join(''):'<p class="hint">반경 안에 영업중 푸드트럭이 없습니다.</p>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script>
</body>
</html>
